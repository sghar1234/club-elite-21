<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Elite 21 - Sign Up</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

<h1>👜 Create Account</h1>

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button
class="start-btn"
onclick="signup()">

Create Account

</button>

<p>Already have an account?</p>

<a href="index.html">

<button class="support-btn">

Login

</button>

</a>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
