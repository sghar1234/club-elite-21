<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Elite 21 - Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>👜 Club Elite 21</h1>

<input
type="email"
id="username"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button class="start-btn" onclick="login()">
Login
</button>

<p>Don't have an account?</p>

<a href="signup.html">
<button class="support-btn">
Create Account
</button>
</a>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
