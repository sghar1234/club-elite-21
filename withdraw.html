<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="logo">

👜 Club Elite 21

<br>

<small>Withdraw</small>

</div>

</header>

<main class="container">

<div class="balance-card">

<h3>Available Balance</h3>

<h1 id="balance">$0.00</h1>

</div>

<div class="product-card">

<h3>💰 Withdraw Request</h3>

<input type="number" id="amount" placeholder="Enter Amount">

<select id="method" style="width:100%;padding:14px;margin-top:10px;border-radius:10px;border:1px solid #ddd;">

<option value="">Select Method</option>

<option>EasyPaisa</option>

<option>JazzCash</option>

<option>Bank Account</option>

<option>USDT</option>

</select>

<input type="text" id="account" placeholder="Account Number / Wallet Address">

<button class="start-btn" onclick="withdrawMoney()">

Submit Withdraw

</button>

</div>

<h2 style="margin:20px 0;">

📜 Withdraw History

</h2>

<div id="history">

No Withdraw Yet

</div>
<script>

function withdrawMoney(){

let amount = Number(document.getElementById("amount").value);

let method = document.getElementById("method").value;

let account = document.getElementById("account").value.trim();

let balance = Number(
document.getElementById("balance").innerText.replace("$","")
);

if(amount<=0){

alert("Enter Valid Amount");

return;

}

if(method==""){

alert("Please Select Payment Method");

return;

}

if(account==""){

alert("Please Enter Account Number");

return;

}

if(amount>balance){

alert(
"❌ Insufficient Balance\n\n" +
"Available Balance : $" + balance +
"\nRequested : $" + amount
);

return;

}

let history =
JSON.parse(localStorage.getItem("withdrawHistory")) || [];

history.push({

amount:amount,

method:method,

account:account,

status:"Pending",

date:new Date().toLocaleString()

});

localStorage.setItem(
"withdrawHistory",
JSON.stringify(history)
);

alert("✅ Withdraw Request Submitted");

loadHistory();

document.getElementById("amount").value="";
document.getElementById("method").value="";
document.getElementById("account").value="";

}
function loadHistory(){

let history =
JSON.parse(localStorage.getItem("withdrawHistory")) || [];

let html = "";

if(history.length === 0){

html = "<h3>No Withdraw Yet</h3>";

}else{

history.forEach(function(item){

html += `

<div class="product-card">

<h3>💰 $${item.amount}</h3>

<p><b>Method:</b> ${item.method}</p>

<p><b>Account:</b> ${item.account}</p>

<p><b>Status:</b>
<span style="color:#ff9900;">
${item.status}
</span>
</p>

<p style="font-size:13px;color:#666;">
${item.date}
</p>

</div>

`;

});

}

document.getElementById("history").innerHTML = html;

}

loadHistory();

</script>

</main>
