<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let selectedTask = null;

// ===== LOAD TASKS =====

function loadTasks(){

let html = "";

if(tasks.length === 0){

html = "<h3 style='text-align:center'>No Task Available</h3>";

}else{

tasks.forEach((task,index)=>{

html += `

<div class="product-card">

<img src="${task.image}" alt="Task">

<div class="product-info">

<h3>${task.name}</h3>

<p>Task Price : <b>Rs ${task.reward}</b></p>

<p style="color:green;">
Commission : <b>Rs ${task.commission || 0}</b>
</p>

<button class="start-btn"
onclick="openTask(${index})">

🚀 Start Task

</button>

</div>

</div>

`;

});

}

document.getElementById("taskList").innerHTML = html;

}

loadTasks();


// ===== OPEN TASK =====

window.openTask=function(index){

selectedTask = tasks[index];

let balance =
parseFloat(
document.getElementById("balance")
.innerText.replace("$","")
) || 0;

let price =
parseFloat(selectedTask.reward);

if(balance < price){

alert(
"❌ Insufficient Balance\n\n" +
"Required Balance : Rs " + price +
"\nYour Balance : Rs " + balance
);

return;

}

document.getElementById("popupImage").src = selectedTask.image;
document.getElementById("popupName").innerText = selectedTask.name;
document.getElementById("popupPrice").innerText = "Rs " + selectedTask.reward;

document.getElementById("popup").style.display="flex";

};


// ===== SUBMIT TASK =====

document.getElementById("closePopup").onclick=function(){

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

orders.push({

image:selectedTask.image,

name:selectedTask.name,

price:selectedTask.reward,

commission:selectedTask.commission || 0,

status:"Pending",

date:new Date().toLocaleString()

});

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

// Update Total Orders

document.getElementById("orders").innerText = orders.length;

document.getElementById("popup").style.display="none";

alert("✅ Task Submitted Successfully");

};

</script>
